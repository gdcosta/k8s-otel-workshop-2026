# Kubernetes + OpenTelemetry workshop — capstone dashboards.
#
# Dashboards ONLY. The workshop deliberately has participants create the
# indexes, the HEC token and the OTTL transforms by hand, so none of that is
# bundled here — shipping it would delete the lesson.

[install]
is_configured = 1
state = enabled

[ui]
is_visible = 1
label = K8s + OTel Workshop

[launcher]
author = Splunk Kubernetes + OpenTelemetry Workshop
description = Capstone dashboards for FW #2, AW #1 and AW #2, plus Application Trace Information v4.0.0.
version = 1.0.0

[package]
id = k8s_ws_dashboards

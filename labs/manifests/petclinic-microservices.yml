---
apiVersion: v1
kind: Service
metadata:
  name: ${WS_USER}-petclinic-srv
  namespace: petclinic
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
    nodePort: 30000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: petclinic
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: petclinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: petclinic
      annotations:
        docker_image_author: "${WS_USER}"
        splunk.com/index: "k8s_ws_petclinic_logs"
    spec:
      initContainers:
      - name: wait-for-config-server
        image: curlimages/curl:8.21.0
        command: ["sh", "-c", "until curl -sf http://config-server:8888/actuator/health; do echo waiting on config-server; sleep 2; done"]
      containers:
      - name: api-gateway
        image: springcommunity/spring-petclinic-api-gateway:3.2.0
        imagePullPolicy: IfNotPresent
        # See the RESOURCE REQUESTS/LIMITS note at the top of this file.
        # api-gateway is the single entry point for every request the load
        # generator sends — confirmed live at 150% CPU under sustained load,
        # the highest of the six by a wide margin — hence the higher CPU
        # request. Memory tier matches the other business services.
        resources:
          requests:
            cpu: 500m
            memory: 768Mi
          limits:
            memory: 1536Mi
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 40

# PetClinic microservices — six Spring Boot services + a shared config store.
# TESTED 2026-08-28 on an 8 vCPU / 32 GB instance. Render with:
#   WS_USER=<you> envsubst < petclinic-microservices.yml > my-petclinic.yml
#
# Every image here is springcommunity/spring-petclinic-<service>:3.2.0 EXCEPT
# customers-service, which this module builds by hand — see FW1 §4-5. That is
# the one image pulled with `imagePullPolicy: Never`; the rest pull from
# Docker Hub.
#
# WHY THESE SIX SERVICE NAMES ARE NOT ${WS_USER}-PREFIXED, UNLIKE EVERYTHING
# ELSE IN THIS WORKSHOP: every other participant-facing name in this repo is
# namespaced by WS_USER because Splunk indexes, dashboards, and locally-built
# image tags are shared surfaces where two participants' names could collide.
# These six Kubernetes Service names never leave your own single-node
# minikube cluster, and — more importantly — the published images have
# `http://discovery-server:8761/eureka/` and the config-server address baked
# into their `docker` Spring profile (see the ConfigMap below). Renaming
# these Services would mean overriding that wiring with per-service
# environment variables for no real benefit, since nothing here is shared
# between participants. WS_USER still namespaces the one thing that IS
# participant-specific: the hand-built customers-service image tag.
#
# The ConfigMap below is copied byte-for-byte from
# https://github.com/spring-petclinic/spring-petclinic-microservices-config
# (the `main` branch, as of 2026-08-28) and baked in via Spring Cloud
# Config Server's "native" profile — see FW1 §6, "Skim it before applying".
# Without this, config-server defaults to fetching this same configuration
# live from GitHub on every restart, an unpinned external dependency this
# workshop otherwise never has. Re-copy these files if you bump
# PETCLINIC_MICROSVC_TAG to a release with a materially different config
# shape; check by diffing against the upstream repo first.
#
# Everything below lives in its own `petclinic` namespace, not `default` —
# the whole application is one unit, worth being able to `kubectl get all -n
# petclinic` or `kubectl delete namespace petclinic` as a single step, the
# same way you'd want to tear down or inspect it in a real cluster shared
# with other workloads. One `kubectl apply -f` creates the namespace and
# everything in it together; nothing extra to run first.
#
# RESOURCE REQUESTS/LIMITS — added 2026-09-03, not present in the original
# migration. Confirmed live on wsuser01's instance (up ~44h under the
# always-on Playwright load generator, not the 3-minute soak these pods were
# originally validated against): with no limits at all, the node-level OOM
# killer intervenes when the whole box gets tight and picks an ARBITRARY
# victim — confirmed hitting cilium-operator (242 restarts) and even
# kube-apiserver (8 restarts), not just these six services. A per-container
# memory limit turns that into a contained, attributable cgroup OOM kill of
# the one container that actually earned it, instead of collateral damage to
# cluster infrastructure. It's also the fix for a separate, real anti-pattern:
# a container-aware JVM with NO memory limit sizes its own default max heap
# off the NODE's total memory (-XX:MaxRAMPercentage, 25% by default), not
# anything sane per-service — every JVM here was silently entitled to grow
# toward multiple GB with zero coordination between them.
#
# Values below are deliberately generous headroom above what `docker stats`
# showed live (five of six services clustered at 700-800Mi RSS at that
# moment — not necessarily each one's peak, since restart recency varies per
# service), not a tight fit — a limit set from one guessed number will just
# convert a systemic problem into a specific one that fails faster, which is
# only useful if you then watch and iterate. Revisit these once
# k8s.pod.memory.usage / k8s.container.memory.usage are actually flowing
# (kubelet_stats is configured but currently emits zero data — separate fix,
# see AGENTS.md) and real steady-state peaks are known.
#
# No CPU limit set, deliberately: this project already found once that CPU
# starvation on this exact box causes the kubelet to miss its node-lease
# renewal and Kubernetes to evict everything (the original reason this
# instance moved from 4 to 8 vCPU) — a hard CPU limit risks reintroducing
# that failure mode via throttling instead of preventing it. requests.cpu
# alone still gives the scheduler a fair-share floor to bin-pack against.
---
apiVersion: v1
kind: Namespace
metadata:
  name: petclinic
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: petclinic-config
  namespace: petclinic
data:
  application.yml: |
    # COMMON APPLICATION PROPERTIES

    server:
      # start services on random port by default
      port: 0
      # The stop processing uses a timeout which provides a grace period during which existing requests will be allowed to complete but no new requests will be permitted
      shutdown: graceful

    # embedded database init, supports mysql too trough the 'mysql' spring profile
    spring:
      sql:
        init:
          schema-locations: classpath*:db/hsqldb/schema.sql
          data-locations: classpath*:db/hsqldb/data.sql
      sleuth:
        sampler:
          probability: 1.0
      cloud:
        config:
          # Allow the microservices to override the remote properties with their own System properties or config file
          allow-override: true
          # Override configuration with any local property source
          override-none: true
      jpa:
        open-in-view: false
        hibernate:
          ddl-auto: none

    # Spring Boot 1.5 makes actuator secure by default
    management.security.enabled: false
    # Enable all Actuators and not only the two available by default /health and /info starting Spring Boot 2.0
    management.endpoints.web.exposure.include: "*"

    # Temporary hack required by the Spring Boot 2 / Spring Cloud Finchley branch
    # Waiting issue https://github.com/spring-projects/spring-boot/issues/13042
    spring.cloud.refresh.refreshable: false


    # Logging
    logging.level.org.springframework: INFO

    # Metrics
    management:
      endpoint:
        metrics:
          enabled: true
        prometheus:
          enabled: true
      endpoints:
        web:
          exposure:
            include: '*'
      metrics:
        export:
          prometheus:
            enabled: true
      tracing:
        sampling:
          probability: 1

    eureka:
      instance:
        # Register IP address instead of hostname to avoid resolution failures on Windows
        prefer-ip-address: true

    # Chaos Engineering
    ---
    spring:
      config:
        activate:
          on-profile: chaos-monkey
    management.endpoint.chaosmonkey.enabled: true
    chaos:
      monkey:
        enabled: true
        watcher:
          component: false
          controller: false
          repository: false
          rest-controller: false
          service: false

    ---
    spring:
      config:
        activate:
          on-profile: docker
    management:
      tracing:
        export:
          zipkin:
            endpoint: "http://tracing-server:9411/api/v2/spans"

    ---
    spring:
      config:
        activate:
          on-profile: mysql
      datasource:
        url: jdbc:mysql://localhost:3306/petclinic?allowPublicKeyRetrieval=true&useSSL=false
        username: root
        password: petclinic
      sql:
        init:
          schema-locations: classpath*:db/mysql/schema.sql
          data-locations: classpath*:db/mysql/data.sql
          mode: ALWAYS
  customers-service.yml: |
    spring:
      config:
        activate:
          on-profile: default
    eureka:
      instance:
        # enable to register multiple app instances with a random server port
        instance-id: ${spring.application.name}:${random.uuid}

    ---
    spring:
      config:
        activate:
          on-profile: docker
    server:
      port: 8081
    eureka:
      client:
        serviceUrl:
          defaultZone: http://discovery-server:8761/eureka/
  discovery-server.yml: |
    server:
      port: 8761

    eureka:
      instance:
        hostname: localhost
      # standalone mode
      client:
        registerWithEureka: false
        fetchRegistry: false
        serviceUrl:
          defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  api-gateway.yml: |
    spring:
      reactor:
        context-propagation: auto
    server:
      port: 8080
      compression:
        enabled: true
        mime-types: application/json,text/css,application/javascript
        min-response-size: 2048

    # Internationalization
    spring.messages.basename: messages/messages

    ---
    spring:
      config:
        activate:
          on-profile: docker
    eureka:
      client:
        serviceUrl:
          defaultZone: http://discovery-server:8761/eureka/
  visits-service.yml: |
    spring:
      config:
        activate:
          on-profile: default
    eureka:
      instance:
        # enable to register multiple app instances with a random server port
        instance-id: ${spring.application.name}:${random.uuid}

    ---
    spring:
      config:
        activate:
          on-profile: docker
    server:
      port: 8082
    eureka:
      client:
        serviceUrl:
          defaultZone: http://discovery-server:8761/eureka/
  vets-service.yml: |
    vets:
      cache:
        ttl: 60
        heap-size: 100

    ---
    spring:
      config:
        activate:
          on-profile: default
    eureka:
      instance:
        # enable to register multiple app instances with a random server port
        instance-id: ${spring.application.name}:${random.uuid}

    ---
    spring:
      config:
        activate:
          on-profile: docker
    server:
      port: 8083
    eureka:
      client:
        serviceUrl:
          defaultZone: http://discovery-server:8761/eureka/
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: petclinic
spec:
  selector:
    app.kubernetes.io/name: config-server
  ports:
  - port: 8888
    targetPort: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: petclinic
  labels:
    app.kubernetes.io/name: config-server
    app.kubernetes.io/part-of: petclinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: config-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: config-server
        app.kubernetes.io/part-of: petclinic
      annotations:
        docker_image_author: "${WS_USER}"
        splunk.com/index: "k8s_ws_petclinic_logs"
    spec:
      containers:
      - name: config-server
        image: springcommunity/spring-petclinic-config-server:3.2.0
        imagePullPolicy: IfNotPresent
        # See the RESOURCE REQUESTS/LIMITS note at the top of this file.
        # config-server and discovery-server are pure infrastructure — no
        # PetClinic business traffic flows through either — so they get the
        # lighter of the two tiers used here.
        resources:
          requests:
            cpu: 200m
            memory: 640Mi
          limits:
            memory: 1280Mi
        env:
        # Overrides the image's baked-in git.uri, which otherwise pulls this
        # exact config from GitHub's `main` branch on every restart — an
        # unpinned network dependency this workshop otherwise never has.
        # "native" backs the Config Server with local files instead; GIT_REPO
        # is the placeholder the image's own application.yml already expects
        # (see `native.searchLocations: file:///${GIT_REPO}`).
        - name: SPRING_PROFILES_ACTIVE
          value: "native"
        - name: GIT_REPO
          value: "/config"
        ports:
        - containerPort: 8888
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8888
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 40
        volumeMounts:
        - name: petclinic-config
          mountPath: /config
      volumes:
      - name: petclinic-config
        configMap:
          name: petclinic-config
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: petclinic
spec:
  selector:
    app.kubernetes.io/name: discovery-server
  ports:
  - port: 8761
    targetPort: 8761
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: petclinic
  labels:
    app.kubernetes.io/name: discovery-server
    app.kubernetes.io/part-of: petclinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: discovery-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discovery-server
        app.kubernetes.io/part-of: petclinic
      annotations:
        docker_image_author: "${WS_USER}"
        splunk.com/index: "k8s_ws_petclinic_logs"
    spec:
      # discovery-server is a Spring Cloud Config Client too — it fetches its
      # own config from config-server at boot and fails fast if that isn't
      # up yet. Every Deployment below carries this same init container for
      # the same reason. See "Why every service waits" in FW1 §6.
      initContainers:
      - name: wait-for-config-server
        image: curlimages/curl:8.21.0
        command: ["sh", "-c", "until curl -sf http://config-server:8888/actuator/health; do echo waiting on config-server; sleep 2; done"]
      containers:
      - name: discovery-server
        image: springcommunity/spring-petclinic-discovery-server:3.2.0
        imagePullPolicy: IfNotPresent
        # See the RESOURCE REQUESTS/LIMITS note at the top of this file.
        resources:
          requests:
            cpu: 200m
            memory: 640Mi
          limits:
            memory: 1280Mi
        ports:
        - containerPort: 8761
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8761
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 40
---
apiVersion: v1
kind: Service
metadata:
  name: customers-service
  namespace: petclinic
spec:
  selector:
    app.kubernetes.io/name: customers-service
  ports:
  - port: 8081
    targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customers-service
  namespace: petclinic
  labels:
    app.kubernetes.io/name: customers-service
    app.kubernetes.io/part-of: petclinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: customers-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customers-service
        app.kubernetes.io/part-of: petclinic
      annotations:
        docker_image_author: "${WS_USER}"
        splunk.com/index: "k8s_ws_petclinic_logs"
    spec:
      initContainers:
      - name: wait-for-config-server
        image: curlimages/curl:8.21.0
        command: ["sh", "-c", "until curl -sf http://config-server:8888/actuator/health; do echo waiting on config-server; sleep 2; done"]
      containers:
      - name: customers-service
        # The one image you build yourself — see FW1 §4-5.
        image: ${WS_USER}/petclinic-customers:v1
        imagePullPolicy: Never
        # See the RESOURCE REQUESTS/LIMITS note at the top of this file.
        # customers-service, vets-service, visits-service each own a database
        # pool and take real PetClinic traffic — the heavier of the two tiers.
        resources:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            memory: 1536Mi
        ports:
        - containerPort: 8081
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 40
---

# Tests the NEXT Splunk OTel Collector chart release against the workshop overlay.
# The chart takes breaking changes on most minor releases (~every 2 weeks), and those
# breakages are silent — config renders, pods stay healthy, no data arrives.
# This turns "the Collector broke again" into a dated issue with a version number.
name: Collector chart canary
on:
  schedule: [{ cron: '0 6 * * 1' }]
  workflow_dispatch:
    inputs:
      compare_version:
        description: >-
          Chart version to test the overlay against, instead of whatever is latest.
          Use this to exercise the render and assertion steps on demand — otherwise
          they only run when a new chart has actually shipped, which leaves the
          drift-detection logic untested for weeks at a time.
        required: false
        default: ''
# The final step files an issue when the chart breaks the overlay. The repository
# default for GITHUB_TOKEN is read-only, so without this the canary would detect
# drift correctly and then fail 403 trying to report it.
permissions:
  contents: read
  issues: write
jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare pinned vs latest chart
        id: v
        run: |
          source versions.env
          helm repo add splunk-otel-collector-chart "$OTEL_CHART_REPO" >/dev/null
          helm repo update >/dev/null
          LATEST="${{ inputs.compare_version }}"
          if [ -z "$LATEST" ]; then
            LATEST=$(helm search repo splunk-otel-collector-chart/splunk-otel-collector \
                      -o json | jq -r '.[0].version')
          else
            echo "::notice::Comparing against $LATEST (manual override)"
          fi
          echo "pinned=$OTEL_CHART_VERSION" >> $GITHUB_OUTPUT
          echo "latest=$LATEST"             >> $GITHUB_OUTPUT
          echo "Pinned $OTEL_CHART_VERSION / latest $LATEST"

      - name: Does our overlay still render on the latest chart?
        if: steps.v.outputs.pinned != steps.v.outputs.latest || inputs.compare_version != ''
        id: render
        continue-on-error: true
        run: |
          export WS_USER=canary LOCAL_IP=10.0.0.1 HEC_TOKEN=00000000-0000-0000-0000-000000000000
          envsubst < labs/collector/values-workshop.yaml > /tmp/v.yaml
          helm template t splunk-otel-collector-chart/splunk-otel-collector \
            --version "${{ steps.v.outputs.latest }}" -f /tmp/v.yaml > /tmp/rendered.yaml

      - name: Assert our settings survived the upgrade
        if: steps.v.outputs.pinned != steps.v.outputs.latest || inputs.compare_version != ''
        id: assert
        continue-on-error: true
        run: |
          fail=0
          # Each of these silently vanished in a past release. Check they still land.
          grep -q 'splunk_hec'                 /tmp/rendered.yaml || { echo "::error::HEC exporter missing"; fail=1; }
          grep -q 'docker_image_author'        /tmp/rendered.yaml || { echo "::error::fromAnnotations dropped"; fail=1; }
          grep -q 'recombine\|is_first_entry'  /tmp/rendered.yaml || { echo "::error::multiline config dropped"; fail=1; }
          grep -q 'k8s_objects'                /tmp/rendered.yaml || { echo "::error::k8sObjects dropped"; fail=1; }
          exit $fail

      - name: Open an issue if the new chart breaks us
        # Only for real drift. A manual override is a test of this workflow, not a
        # finding, so it must not file an issue.
        if: >-
          (steps.render.outcome == 'failure' || steps.assert.outcome == 'failure')
          && inputs.compare_version == ''
        uses: actions/github-script@v7
        with:
          script: |
            const p = "${{ steps.v.outputs.pinned }}", l = "${{ steps.v.outputs.latest }}";
            github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Collector chart ${l} breaks the workshop overlay (pinned ${p})`,
              labels: ['chart-drift'],
              body: [
                `The workshop overlay does not render cleanly against **${l}**.`,
                ``,
                `Pinned: \`${p}\` · Latest: \`${l}\``,
                ``,
                `Compare the values schema before bumping \`OTEL_CHART_VERSION\` in \`versions.env\`:`,
                `- https://github.com/signalfx/splunk-otel-collector-chart/releases/tag/splunk-otel-collector-${l}`,
                ``,
                `Chart config failures are usually **silent** — the config renders and pods stay`,
                `healthy while no data arrives. Re-run \`scripts/verify-fw2.sh\` against a live`,
                `cluster before accepting an upgrade.`
              ].join('\n')
            })

      - name: Report the result of a manual test run
        if: inputs.compare_version != ''
        run: |
          echo "render: ${{ steps.render.outcome }}   assert: ${{ steps.assert.outcome }}"
          if [ "${{ steps.render.outcome }}" = "failure" ] || [ "${{ steps.assert.outcome }}" = "failure" ]; then
            echo "::error::Overlay does NOT survive chart ${{ steps.v.outputs.latest }}"
            exit 1
          fi
          echo "Overlay renders cleanly on ${{ steps.v.outputs.latest }}; all assertions hold."

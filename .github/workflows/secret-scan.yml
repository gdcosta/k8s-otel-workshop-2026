# Standing guard against credentials reaching the repo.
# This workshop handles HEC tokens, Observability Cloud ingest and RUM tokens,
# Splunk admin passwords and TLS keys — all of which are easy to paste in by
# accident while iterating on a lab file.
#
# We run the gitleaks binary directly rather than gitleaks-action, because the
# action performs an INCREMENTAL scan of each push's commit range. On the very
# first push that range is `<first-commit>^..<head>`, which does not resolve, so
# the scan aborted having read 0 bytes and still reported "no leaks found in
# partial scan" — a green-looking result that proved nothing. Scanning the full
# history every time is cheap here and is what the local pre-push check does, so
# CI and local now agree.
name: Secret scan
on:
  push:
  workflow_dispatch:      # run it by hand from the Actions tab when you want to
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # full history, not just the tip

      - name: Install pinned gitleaks
        run: |
          source versions.env
          echo "Using gitleaks ${GITLEAKS_VERSION}"
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan full history
        run: |
          /tmp/gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path /tmp/gitleaks.sarif \
            --exit-code 1 \
            --log-opts='--all'

      - name: Scan the working tree as well
        # detect --source scans git history; this catches anything staged or
        # untracked that history would not show.
        run: |
          /tmp/gitleaks detect --no-git --source . --config .gitleaks.toml --redact --exit-code 1

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-sarif
          path: /tmp/gitleaks.sarif
          if-no-files-found: ignore

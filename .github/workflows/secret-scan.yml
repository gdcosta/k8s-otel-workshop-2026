# Standing guard against credentials reaching the repo.
# This workshop handles HEC tokens, Observability Cloud ingest and RUM tokens,
# Splunk admin passwords and TLS keys — all of which are easy to paste in by
# accident while iterating on a lab file.
name: Secret scan
on:
  push:
  pull_request:
  schedule:
    - cron: '0 5 * * 1'
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # scan history, not just the tip
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
